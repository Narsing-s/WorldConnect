name: Personal MuleSoft Global Job Discovery

on:
  workflow_dispatch:
    inputs:
      locations:
        description: "Countries/locations (use 'all' for India, US and worldwide)"
        required: true
        default: "all"
        type: string
      max_matches:
        description: "Maximum matched jobs in this run"
        required: true
        default: "50"
        type: choice
        options: ["10", "20", "30", "50"]
      include_remote:
        description: "Include remote roles"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: personal-mulesoft-job-run
  cancel-in-progress: false

jobs:
  discover-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate private configuration
        env:
          APP_URL: ${{ secrets.WORLDCONNECT_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ]; then
            echo "::error::Add WORLDCONNECT_APP_URL in this repository's Actions secrets."
            exit 1
          fi
          case "$APP_URL" in https://*) ;; *) echo "::error::WORLDCONNECT_APP_URL must use HTTPS"; exit 1;; esac

      - name: Fetch global MuleSoft openings
        env:
          APP_URL: ${{ secrets.WORLDCONNECT_APP_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 90 \
            "${APP_URL%/}/api/jobs/mulesoft" \
            -H "Accept: application/json" -o jobs.json
          jq -e '.jobs | type == "array"' jobs.json >/dev/null
          echo "Fetched $(jq '.jobs | length' jobs.json) dedicated MuleSoft listings."
          jq -r '(.diagnostics // [])[] | "Provider: " + .provider + " | available=" + (.available|tostring) + " | fetched=" + (.fetched|tostring) + " | matched=" + (.matched|tostring)' jobs.json || true

      - name: Match global MuleSoft roles for this candidate
        env:
          LOCATIONS: ${{ inputs.locations }}
          MAX_MATCHES: ${{ inputs.max_matches }}
          INCLUDE_REMOTE: ${{ inputs.include_remote }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, os, re
          from datetime import datetime, timezone
          with open("jobs.json", encoding="utf-8") as f:
              payload = json.load(f)
          jobs = payload.get("jobs") or []
          raw = os.environ["LOCATIONS"].strip().lower()
          worldwide = raw in ("all", "all countries", "worldwide", "*")
          locations = [] if worldwide else [x.strip().lower() for x in raw.split(",") if x.strip()]
          include_remote = os.environ["INCLUDE_REMOTE"].lower() == "true"
          limit = int(os.environ["MAX_MATCHES"])
          role = re.compile(r"mulesoft|mule\\s*4|anypoint\\s*(platform|studio)|mule\\s*runtime", re.I)
          rows, seen = [], set()
          for job in jobs:
              title = str(job.get("title") or "").strip()
              company = str(job.get("company") or "").strip()
              location = str(job.get("location") or "").strip()
              description = str(job.get("description") or "")
              tags = " ".join(str(x) for x in (job.get("tags") or []))
              url = str(job.get("url") or "").strip()
              identity = url.split("?")[0].rstrip("/").lower() or str(job.get("id") or "").lower()
              if not title or not url.startswith("https://") or identity in seen:
                  continue
              if not role.search(" ".join([title, company, location, description, tags])):
                  continue
              seen.add(identity)
              remote = bool(job.get("remote")) or bool(re.search(r"remote|anywhere|worldwide|global", location, re.I))
              location_ok = worldwide or any(term in location.lower() for term in locations) or (include_remote and remote)
              if not location_ok:
                  continue
              text = " ".join([title, company, description, tags])
              employment = "Full-time stated" if re.search(r"full.?time|permanent", text, re.I) else "Verify employment type"
              experience = str(job.get("experience") or "Not stated")
              rows.append({"title":title,"company":company or "Not listed","location":location or "Not specified",
                "experience":experience,"employment_check":employment,
                "candidate_fit":"Review requirement against 4+ MuleSoft / 4.8+ IT years",
                "source":str(job.get("source") or "WorldConnect"),"posted_at":str(job.get("postedAt") or ""),
                "url":url,"job_id":str(job.get("id") or "")})
          rows.sort(key=lambda r:(r["employment_check"]!="Full-time stated",r["title"].lower()))
          rows=rows[:limit]
          fields=["title","company","location","experience","employment_check","candidate_fit","source","posted_at","url","job_id"]
          with open("mulesoft-global-matches.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          diagnostics=payload.get("diagnostics") or []
          with open("run-summary.md","w",encoding="utf-8") as f:
              f.write("# Personal MuleSoft global job matches\\n\\n")
              f.write(f"- Run time (UTC): {datetime.now(timezone.utc).isoformat()}\\n")
              f.write("- Candidate profile: 4.8+ years overall IT, 4+ years MuleSoft; 30-day notice\\n")
              f.write(f"- Requested locations: {'All countries (including India and US)' if worldwide else ', '.join(locations)}\\n")
              f.write(f"- Dedicated MuleSoft listings fetched: {len(jobs)}\\n- Matches: {len(rows)}\\n\\n")
              f.write("## Provider diagnostics\\n\\n")
              for item in diagnostics:
                  f.write(f"- {item.get('provider')}: {'available' if item.get('available') else 'unavailable'}; fetched {item.get('fetched',0)}; MuleSoft matched {item.get('matched',0)}\\n")
              f.write("\\n## LinkedIn and Naukri job-search links\\n\\n")
              f.write("- [LinkedIn — MuleSoft jobs worldwide](https://www.linkedin.com/jobs/search/?keywords=MuleSoft)\\n")
              f.write("- [LinkedIn — MuleSoft jobs in the United States](https://www.linkedin.com/jobs/search/?keywords=MuleSoft&location=United%20States)\\n")
              f.write("- [LinkedIn — MuleSoft jobs in India](https://www.linkedin.com/jobs/search/?keywords=MuleSoft&location=India)\\n")
              f.write("- [Naukri — MuleSoft jobs in India](https://www.naukri.com/mulesoft-jobs)\\n")
              f.write("\\n> LinkedIn and Naukri are provided as direct search links, not scraped feeds: neither account login nor an authorized public job API is configured.\\n\\n")
              f.write("> **Application status: Not submitted.** This workflow discovers and prepares a shortlist only. It does not sign in, submit applications, or claim an application was sent. Verify location/work authorization, experience, employment type and employer application channel for every role.\\n\\n")
              f.write("| Role | Company | Location | Experience | Employment check | Source | Apply link |\\n|---|---|---|---|---|---|---|\\n")
              for r in rows:
                  safe=lambda s:str(s).replace("|","\\\\|").replace("\\n"," ")
                  f.write(f"| {safe(r['title'])} | {safe(r['company'])} | {safe(r['location'])} | {safe(r['experience'])} | {safe(r['employment_check'])} | {safe(r['source'])} | [Employer application]({r['url']}) |\\n")
          print(f"Fetched {len(jobs)} listings; prepared {len(rows)} global candidate matches.")
          PY

      - name: Publish this run's report
        uses: actions/upload-artifact@v4
        with:
          name: personal-mulesoft-global-job-matches
          path: |
            mulesoft-global-matches.csv
            run-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Add report to workflow summary
        run: cat run-summary.md >> "$GITHUB_STEP_SUMMARY"
