name: WorldConnect CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Lint
        run: npm run lint
      - name: Verify platform security and migration guardrails
        run: npm run verify:platform
      - name: Production build
        run: npm run build
