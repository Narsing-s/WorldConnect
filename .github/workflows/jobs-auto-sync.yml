name: WorldConnect automatic job sync
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Sync public job feeds into WorldConnect
        env:
          APP_URL: ${{ secrets.WORLDCONNECT_APP_URL }}
          SYNC_SECRET: ${{ secrets.JOBS_SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$SYNC_SECRET" ]; then
            echo "::error::Set WORLDCONNECT_APP_URL and JOBS_SYNC_SECRET in repository Actions secrets."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::WORLDCONNECT_APP_URL must be the HTTPS production URL of the WorldConnect app."; exit 1 ;;
          esac

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 90 \
            -X POST "${APP_URL%/}/api/jobs/sync" \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "Content-Type: application/json" \
            --output "$RESPONSE_FILE" --write-out "%{http_code}")" || {
              echo "::error::Could not reach the WorldConnect job-sync endpoint. Check WORLDCONNECT_APP_URL and the deployment."
              cat "$RESPONSE_FILE"
              exit 1
            }

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::WorldConnect job-sync endpoint returned HTTP $HTTP_CODE. Confirm WORLDCONNECT_APP_URL points to the deployed WorldConnect app (not another Vercel project) and that /api/jobs/sync is deployed."
            sed -n '1,30p' "$RESPONSE_FILE"
            exit 1
          fi

          if ! jq -e '.success == true' "$RESPONSE_FILE" >/dev/null; then
            echo "::error::Sync endpoint returned an unexpected response."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          ADDED="$(jq -r '.added // 0' "$RESPONSE_FILE")"
          UPDATED="$(jq -r '.updated // 0' "$RESPONSE_FILE")"
          IMPORTED="$(jq -r '.imported // 0' "$RESPONSE_FILE")"
          JOB_COUNT="$(jq -r '(.jobs // []) | length' "$RESPONSE_FILE")"

          {
            echo "## WorldConnect job sync"
            echo ""
            echo "### Sync totals"
            echo "- Newly added: **$ADDED**"
            echo "- Updated: **$UPDATED**"
            echo "- Total synced: **$IMPORTED**"
            echo "- Jobs listed: **$JOB_COUNT**"
            echo ""
            echo "### Job details"
            echo "| Status | Job title | Company | Location | Source | Posted | Link |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '(.jobs // [])[] |
              "| " + ((.action // "") | gsub("[|\\r\\n]"; " ")) +
              " | " + ((.title // "") | gsub("[|\\r\\n]"; " ")) +
              " | " + ((.company // "") | gsub("[|\\r\\n]"; " ")) +
              " | " + ((.location // "") | gsub("[|\\r\\n]"; " ")) +
              " | " + ((.source // "") | gsub("[|\\r\\n]"; " ")) +
              " | " + ((.postedAt // "N/A") | gsub("[|\\r\\n]"; " ")) +
              " | [Apply](" + ((.url // "") | gsub("[|\\r\\n]"; "")) + ") |"' "$RESPONSE_FILE"
            echo ""
            echo "### Provider warnings"
            jq -r '(.errors // [])[] | "- " + .' "$RESPONSE_FILE"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "Job sync completed: $ADDED added, $UPDATED updated, $IMPORTED total synced."
